[package]
name = "blutils"
version = "0.1.1"
edition = "2021"
build = "build.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.4", features = ["cargo", "derive"] }
syntect = "5.2.0"
libc = { version = "0.2.155", features = ["extra_traits"] }
fs_extra = "1.3.0"
walkdir = "2.5.0"
termsize = "0.1.9"
chrono = { version = "0.4.38", features = ["alloc", "clock"] }
regex = { package = "regex-lite", version = "0.1.6"}

[build-dependencies]
chrono = "0.4.38"

[profile.release]
strip = true
opt-level = "z"
lto = true
